[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log

[program:naive]
command=/usr/local/bin/naive /etc/naive/config.json
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
