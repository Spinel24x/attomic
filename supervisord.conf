[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log

[program:naive]
command=/usr/local/bin/naive --listen=http://127.0.0.1:8080 --padding
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
