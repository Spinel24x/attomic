[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=0

[program:i2p]
command=/bin/sh -c "ROUTER=$(find /i2p -name i2prouter -type f 2>/dev/null | head -1) && $ROUTER start"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
