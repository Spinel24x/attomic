[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log

[program:hysteria]
command=/usr/local/bin/hysteria server -c /etc/hysteria/config.yaml
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

[program:udp2raw]
command=/usr/local/bin/udp2raw -s -l 0.0.0.0:53 -r 127.0.0.1:443 --raw-mode faketcp -k "attomic"
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
