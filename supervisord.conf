[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log

[program:socks5]
command=python3 /socks5.py
autostart=true
autorestart=true

[program:websockify]
command=websockify 127.0.0.1:6080 127.0.0.1:53
autostart=true
autorestart=true

[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
