[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log

[program:hysteria]
command=/usr/local/bin/hysteria server -c /etc/hysteria/config.yaml
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr

[program:socat]
command=socat TCP-LISTEN:53,fork,reuseaddr UDP:127.0.0.1:443
autostart=true
autorestart=true
stdout_logfile=/dev/stdout
stderr_logfile=/dev/stderr
