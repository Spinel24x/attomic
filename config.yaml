cat > config.yaml << 'EOF'
server: :443

tls:
  cert: /etc/hysteria/cert.pem
  key: /etc/hysteria/key.pem

auth:
  type: password
  password: Attomic2026!

masquerade:
  type: proxy
  proxy:
    url: https://speed.cloudflare.com
    rewriteHost: true

quic:
  initStreamReceiveWindow: 16777216
  maxStreamReceiveWindow: 16777216
  initConnReceiveWindow: 33554432
  maxConnReceiveWindow: 33554432
  maxIdleTimeout: 60s
  keepAlivePeriod: 15s
  disablePathMTUDiscovery: true

bandwidth:
  up: 500 mbps
  down: 500 mbps

ignoreClientBandwidth: true

speedTest: false

disableUDP: false

udpIdleTimeout: 30s

resolver:
  type: https
  https:
    addr: 1.1.1.1:443
    timeout: 5s
    sni: cloudflare-dns.com
    insecure: false
EOF

git add config.yaml
git commit -m "fix: remove unsupported outbounds and acl from server config"
git push
