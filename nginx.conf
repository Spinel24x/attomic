cat > nginx.conf << 'EOF'
load_module /usr/lib/nginx/modules/ngx_stream_module.so;

worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

stream {
    server {
        listen 53;
        proxy_pass 127.0.0.1:1080;
        proxy_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_buffer_size 16k;
    }
}

http {
    server {
        listen 80;
        location / {
            return 200 'attomic OK';
        }
    }
}
EOF

git add nginx.conf
git commit -m "use port 53 for SOCKS5 proxy"
git push
