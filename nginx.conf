worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

stream {
    server {
        listen 12130;
        proxy_pass 127.0.0.1:53;
        proxy_connect_timeout 1s;
        proxy_timeout 3s;
    }
}

http {
    server {
        listen 80;
        location /health {
            return 200 'OK';
        }
    }
}
