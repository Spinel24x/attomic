worker_processes auto;
pid /run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    # DNS-over-HTTPS endpoint
    server {
        listen 80;
        
        location /dns-query {
            proxy_pass http://127.0.0.1:53;
            proxy_set_header Host $host;
        }
        
        location / {
            return 200 'attomic DNS Proxy - Active';
        }
        
        location /health {
            return 200 'OK';
        }
    }
}
